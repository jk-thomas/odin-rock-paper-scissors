<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors - Login</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Rock Paper Scissors</h1>
    </header>
    <h3 style="margin-bottom: 0;">Choose number of rounds: </h3>
    <div class="dropdown" id="dropdown-container"></div>
    
    <form id="loginForm">
        <label for="username">Enter Username:</label>
        <input type="text" id="username" required>
        
        <label for="rounds">Number of Rounds:</label>
        <input type="number" id="rounds" min="1" value="3" required>

        <button type="submit">Start Game</button>
    </form>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent page reload

            // Get user input
            const username = document.getElementById('username').value;
            const rounds = document.getElementById('rounds').value;

            // Save data to session storage
            sessionStorage.setItem('username', username);
            sessionStorage.setItem('rounds', rounds);

            // Redirect to game page
            window.location.href = 'game.html';
        });
    </script>
</body>
</html>
